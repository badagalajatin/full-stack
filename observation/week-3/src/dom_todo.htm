<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        
        .completed {
            text-decoration: line-through;
            color: gray;
        }
        
        #taskList {
            list-style-type: none;
            padding: 0;
        }
        
        #taskList li {
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .task-text {
            min-width: 150px;
        }
    </style>
</head>
<body>

    <h1>My To-Do List</h1>
    
    <div>
        <input type="text" id="taskInput" placeholder="Enter a task................">
        <button id="addTaskBtn">Add Task</button>
    </div>
    
    <p id="emptyMessage">No tasks available.</p>
    
    <ul id="taskList"></ul>

    <script>
        // 1. DOM element selection
        const taskInput = document.getElementById('taskInput');
        const addTaskBtn = document.getElementById('addTaskBtn');
        const taskList = document.getElementById('taskList');
        const emptyMessage = document.getElementById('emptyMessage');

        // Function to check if the list is empty and display the message accordingly
        function updateEmptyMessage() {
            if (taskList.children.length === 0) {
                emptyMessage.style.display = 'block';
            } else {
                emptyMessage.style.display = 'none';
            }
        }

        // 2. Handling click events with an Event Listener
        addTaskBtn.addEventListener('click', function() {
            const taskText = taskInput.value.trim();
            
            // Prevent adding empty tasks
            if (taskText === '') {
                alert('Please enter a task.');
                return;
            }

            // 3. Dynamic element creation
            const listItem = document.createElement('li');
            
            const taskSpan = document.createElement('span');
            taskSpan.textContent = taskText;
            taskSpan.className = 'task-text';

            const completeBtn = document.createElement('button');
            completeBtn.textContent = 'Complete';

            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = 'Delete';

            // Complete button event listener (Visual indication of completion)
            completeBtn.addEventListener('click', function() {
                taskSpan.classList.toggle('completed');
            });

            // Delete button event listener (Removing elements)
            deleteBtn.addEventListener('click', function() {
                listItem.remove(); // Removes the task from the webpage
                updateEmptyMessage(); // Check if list is empty after deletion
            });

            // 4. Dynamic modification of the DOM
            listItem.appendChild(taskSpan);
            listItem.appendChild(completeBtn);
            listItem.appendChild(deleteBtn);
            
            taskList.appendChild(listItem);

            // Clear the input field after adding
            taskInput.value = '';
            
            // Hide the "No tasks available" message
            updateEmptyMessage();
        });

        // Initialize the message state on page load
        updateEmptyMessage();
    </script>
</body>
</html>
