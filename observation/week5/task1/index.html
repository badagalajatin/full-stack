<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Product Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Product Calculator</h1>

        <div class="form-group">
            <label for="productName">Product Name:</label>
            <input type="text" id="productName" placeholder="Enter product name">
        </div>

        <div class="form-group">
            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" min="1" value="1">
        </div>

        <div class="form-group">
            <label for="price">Price per Unit (₹):</label>
            <input type="number" id="price" min="0" step="0.01" value="0">
        </div>

        <button id="calculateButton">Calculate Total</button>

        <p id="errorMessage"></p>

        <div class="result">
            <h2>Order Summary</h2>
            <p>Product: <span id="displayProduct">-</span></p>
            <p>Total Price: ₹<span id="totalPrice">0.00</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
